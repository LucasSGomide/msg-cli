name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      # Build first: the bin test runs dist/cli.js through a symlink, which is
      # how npm installs it and the only way the entry-point guard is exercised.
      - run: npm run build
      - run: npm test
      # msg-cli plans its own roadmap with its own payload, so the vendored
      # engine is exercised against a real tree on every push.
      - run: make roadmap-check
      # A wrong `files:` field is the classic first-publish bug and it fails
      # silently. The pack test asserts the payload is actually in the tarball.
      - run: npm pack --dry-run
